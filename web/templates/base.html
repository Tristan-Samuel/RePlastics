<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lab{% endblock %} · Metal / plastic</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=16">
</head>
<body
  data-running="{{ 'yes' if job_state.running else 'no' }}"
  data-watch-job="{% block watch %}no{% endblock %}"
>
  <header class="top">
    <a class="brand" href="{{ url_for('models_page') }}">Metal / plastic</a>
    <nav>
      <a href="{{ url_for('models_page') }}" {% if request.endpoint in ('models_page', 'model_page', 'saved_page') %}aria-current="page"{% endif %}>Models</a>
      <a href="{{ url_for('data_page') }}" {% if request.endpoint == 'data_page' %}aria-current="page"{% endif %}>Data</a>
      <a href="{{ url_for('jobs_page') }}" {% if request.endpoint == 'jobs_page' %}aria-current="page"{% endif %}>Jobs</a>
      <a href="{{ url_for('jetson_page') }}" {% if request.endpoint == 'jetson_page' %}aria-current="page"{% endif %}>Jetson</a>
    </nav>
    <span id="session" class="{% if session_state.up %}up{% endif %}">{{ session_state.label }}</span>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  {% include "_log.html" %}
  <script src="{{ url_for('static', filename='app.js') }}?v=13"></script>
</body>
</html>
